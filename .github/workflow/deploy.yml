name: Deploy Obsidian HTML Export to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if your default branch is named master
    paths:
      - "content/**" # Optional: Only trigger a deploy when files inside 'content' change
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  content: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: './content'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
